<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>LumaSat</title>
</head>

<body>

  <div class="card">

    <div class="logo-wrapper">
      <img src="img/LumaSat-Logo.png" alt="LumaSat Logo">
    </div>

    <h1 class="brand-title">
      <span class="luma">Luma</span><span class="sat">Sat</span>
    </h1>
    <p class="subtitle">Sistema de Monitoramento Industrial</p>

    <form action="/login" method="POST">

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="mail" width="16" height="16"></i></span>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="senha">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="lock" width="16" height="16"></i></span>
          <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>
      </div>

      <p id="mensagemErro" style="color: red; margin-top: 10px; display: none;"></p>

      <button type="submit">Entrar</button>

    </form>

    <p class="register-link">Recebeu um convite? <a href="cadastrar.html">Criar conta</a></p>

    <hr class="divider">
    <p class="hint">O cadastro é feito somente por convite do gerente da sua empresa</p>

  </div>

  <script>lucide.createIcons();</script>

  <script>
    // Mensagens de erro vindas do servidor (?erro=codigo)
    const erro = new URLSearchParams(window.location.search).get('erro');
    if (erro) {
      const mensagens = {
        pendente: "Seu cadastro está aguardando aprovação do gerente.",
        rejeitado: "Seu cadastro não foi aprovado. Fale com o gerente da sua empresa.",
        inativo: "Esta conta está inativa. Fale com o gerente da sua empresa.",
        bloqueado: "Muitas tentativas. Aguarde alguns minutos e tente novamente.",
        servidor: "Erro no servidor. Tente novamente em instantes."
      };
      const msg = document.getElementById('mensagemErro');
      msg.innerText = mensagens[erro] || "E-mail ou senha incorretos!";
      msg.style.display = "block";
    }
  </script>

</body>

</html>
