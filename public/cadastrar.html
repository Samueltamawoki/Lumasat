<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="cadastrar.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>LumaSat — Criar Conta</title>
</head>

<body>

  <div class="card">

    <!-- NOVO BOTÃO: Voltar para o Dashboard -->
    <div class="top-actions">
      <a href="dashboard.html" id="btnVoltarDashboard" class="btn-voltar">
        <i data-lucide="arrow-left" width="16" height="16"></i>
        Voltar ao Dashboard
      </a>
    </div>

    <div class="logo-wrapper">
      <img src="img/LumaSat-Logo.png" alt="LumaSat Logo">
    </div>

    <h2>Criar Conta</h2>
    <p class="page-desc">Cadastre-se no LumaSat</p>

    <form action="/cadastrar" method="POST">

      <div class="field">
        <label class="field-label" for="nomeCompleto">Nome Completo</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="user" width="16" height="16"></i></span>
          <input type="text" id="nomeCompleto" name="nome" placeholder="Digite o seu nome" required>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="empresa">Nome da Empresa</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="building" width="16" height="16"></i></span>
          <input type="text" id="empresa" name="empresa" placeholder="Ex: Empresa Alfa" required>
        </div>
        <span id="empresaHint" class="field-hint" style="display: none;">Empresa vinculada automaticamente ao seu perfil</span>
      </div>

      <div class="field">
        <label class="field-label" for="nivel">Nível de Acesso</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="shield" width="16" height="16"></i></span>
          <select id="nivel" name="nivel" required>
            <option value="" disabled selected hidden>Selecione o nível de acesso</option>
            <option value="operador">Operador</option>
            <option value="técnico">Técnico</option>
            <option value="Supervisor">Supervisor</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="email">E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="mail" width="16" height="16"></i></span>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="senha">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="lock" width="16" height="16"></i></span>
          <input type="password" id="senha" name="senha" placeholder="••••••••" required minlength="6">
        </div>
        <span class="field-hint">Mínimo de 6 caracteres</span>
      </div>

      <div class="field">
        <label class="field-label" for="confirmarSenha">Confirmar Senha</label>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="lock" width="16" height="16"></i></span>
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit">Criar Conta</button>

    </form>

  </div>

  <script>
    lucide.createIcons();

    document.addEventListener("DOMContentLoaded", () => {
      const usuarioLogado = JSON.parse(localStorage.getItem("usuario")) || {};
      const inputEmpresa = document.getElementById("empresa");
      const empresaHint = document.getElementById("empresaHint");

      // Verifica se é o utilizador Master (altere o e-mail ou nível conforme o seu banco)
      const isMaster = 
        (usuarioLogado.nivel && usuarioLogado.nivel.toLowerCase() === "master") ||
        usuarioLogado.email === "admin@email.com";

      // Se NÃO for o Master e tiver uma empresa associada, preenche e bloqueia a edição
      if (!isMaster && usuarioLogado.empresa) {
        inputEmpresa.value = usuarioLogado.empresa;
        inputEmpresa.readOnly = true; // readOnly garante que o valor continua a ser enviado no formulário
        inputEmpresa.classList.add("input-bloqueado");
        empresaHint.style.display = "block";
      }
    });
  </script>
</body>

</html>
